name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolve version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [[ "$VERSION_NAME" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION_NAME (code $VERSION_CODE, prerelease=$IS_PRERELEASE)"

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :domain:test :app:testDebugUnitTest assembleRelease --no-daemon
          APK_FILE="LeanCast-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          APK_SHA256="$(sha256sum "$APK_FILE" | awk '{print $1}')"
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
            CHANGELOG="Release v${VERSION_NAME}"
          fi
          export APK_FILE APK_SHA256 CHANGELOG
          python3 - <<'PY'
          import json, os
          manifest = {
              "version": os.environ["VERSION_NAME"],
              "changelog": os.environ.get("CHANGELOG", "").strip() or f"Release v{os.environ['VERSION_NAME']}",
              "assets": {
                  "android-universal": {
                      "file": os.environ["APK_FILE"],
                      "sha256": os.environ["APK_SHA256"],
                  }
              },
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          ls -lh "$APK_FILE" latest.json
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            LeanCast-*.apk
            latest.json
